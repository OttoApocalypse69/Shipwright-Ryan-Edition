name: SRE and FTEP monorepo

on:
  pull_request:
    paths:
      - "apps/**"
      - "crates/**"
      - "integrations/**"
      - "packages/**"
      - "runtimes/**"
      - "database/**"
      - "tooling/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ftep-monorepo.yml"
  push:
    branches: [develop]
    paths:
      - "apps/**"
      - "crates/**"
      - "integrations/**"
      - "packages/**"
      - "runtimes/**"
      - "database/**"
      - "tooling/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ftep-monorepo.yml"

permissions:
  contents: read

jobs:
  workspace:
    name: Rust, launcher, and TypeScript workspace
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy,rustfmt

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test workspace
        run: pnpm test

      - name: Lint workspace
        run: pnpm lint

      - name: Build workspace
        run: pnpm build

  migrations:
    name: PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ftep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations from an empty database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d ftep_test -v ON_ERROR_STOP=1 -f database/migrations/0001_ftep_core.sql

  security:
    name: Dependency and static security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0, run_install: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: cargo install cargo-audit --locked
      - run: cargo audit
