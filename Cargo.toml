[workspace]
members = [
    "apps/launcher/src-tauri",
    "crates/ftep-core",
    "crates/ftep-runtime",
    "integrations/native/shipwright",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
