[workspace]
members = [
    "apps/launcher/src-tauri",
    "crates/ftep-core",
    "crates/ftep-runtime",
    "crates/sre-library",
    "crates/sre-device",
    "crates/sre-entitlement",
    "crates/sre-overlay",
    "crates/sre-achievements",
    "crates/sre-diagnostics",
    "crates/sre-updater",
    "crates/ftep-policy",
    "integrations/native/shipwright",
    "integrations/emulator/wiiu",
    "integrations/emulator/switch",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sha2 = "0.10.9"
tempfile = "3.23.0"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
url = { version = "2.5.7", features = ["serde"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
