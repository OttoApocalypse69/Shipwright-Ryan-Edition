[package]
name = "sre-launcher"
default-run = "sre-launcher"
version.workspace = true
description = "Super Runtime Environment desktop launcher"
authors = ["SRE Project"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "sre_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
sre-core = { path = "../../../crates/ftep-core" }
sre-runtime = { path = "../../../crates/ftep-runtime" }
sre-library = { path = "../../../crates/sre-library" }
sre-device = { path = "../../../crates/sre-device" }
sre-entitlement = { path = "../../../crates/sre-entitlement" }
sre-achievements = { path = "../../../crates/sre-achievements" }
sre-overlay = { path = "../../../crates/sre-overlay" }
sre-diagnostics = { path = "../../../crates/sre-diagnostics" }
sre-updater = { path = "../../../crates/sre-updater" }
sre-shipwright-adapter = { path = "../../../integrations/native/shipwright" }
sre-two-ship-adapter = { path = "../../../integrations/native/two-ship" }
sre-wiiu-adapter = { path = "../../../integrations/emulator/wiiu" }
sre-switch-adapter = { path = "../../../integrations/emulator/switch" }
sre-dolphin-adapter = { path = "../../../integrations/emulator/dolphin" }
fs2 = "0.4.3"
base64.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.6"
sha2.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tempfile.workspace = true
url.workspace = true
uuid.workspace = true
reqwest.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }
