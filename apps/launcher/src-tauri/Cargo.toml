[package]
name = "ftep-launcher"
version.workspace = true
description = "FICSIT Treaty Enforcement Platform launcher"
authors = ["FTEP Compliance Directorate"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ftep_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
ftep-core = { path = "../../../crates/ftep-core" }
ftep-runtime = { path = "../../../crates/ftep-runtime" }
ftep-shipwright-adapter = { path = "../../../integrations/native/shipwright" }
fs2 = "0.4.3"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10.6"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tempfile = "3.23.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_UI_Input_XboxController",
] }
